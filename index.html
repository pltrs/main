<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLATTERS — рофл-сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Логотип -->
            <div class="logo">
                <h1 class="title">PLATTERS</h1>
                <p class="subtitle">— рофл-сайт на вайб-коде</p>
            </div>

            <!-- Описание -->
            <p class="desc">
                Не имеет никакой связи с настоящей компанией (которой и так нет).<br>
                Но планы имеются.
            </p>

            <!-- Кнопки -->
            <div class="buttons">
                <a href="mob.html" class="btn btn-mobile">
                    <span class="btn-text">PLTRS.MOBILE</span>
                    <span class="btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 7h10v10" />
                            <path d="M7 17 17 7" />
                        </svg>
                    </span>
                </a>
                <a href="bank.html" class="btn btn-bank">
                    <span class="btn-text">PLTRS.BANK</span>
                    <span class="btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18" />
                            <path d="M6 6 18 18" />
                        </svg>
                    </span>
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
